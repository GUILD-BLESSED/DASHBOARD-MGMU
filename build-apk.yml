name: Build Android APK

on:
  push:
    tags:
      - 'v*' # Se compilará automáticamente cada vez que crees una etiqueta (versión)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npx cap init --name "MegaMU Guild Tracker" --package-id "com.megamu.guildtracker" --web-dir "./"
          npx cap add android

      - name: Build Android Project
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
